name: Release

# Releases come from master. A push that changes the version in Cargo.toml,
# or running this workflow by hand, builds every target, tags vX.Y.Z and
# publishes a GitHub release with the archives and the Homebrew formula,
# using the version's CHANGELOG.md section as its notes (a version without
# one fails here). Pushes that leave the version alone, or whose tag already
# exists, stop after the first check. The tap (seamoss/homebrew-textrix)
# picks up the new formula by itself.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            release=false
          elif [ "$EVENT" = workflow_dispatch ]; then
            release=true
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null \
            && git show "$BEFORE:Cargo.toml" | grep -qx "version = \"$version\""; then
            echo "the version is still $version"
            release=false
          else
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ] && ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name="textrix-v$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/textrix" README.md LICENSE .env.example "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: textrix-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Homebrew formula
        run: packaging/homebrew/formula.sh "$VERSION" dist > dist/textrix.rb
      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } } found' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Textrix ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: dist/*
