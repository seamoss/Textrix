name: Website

# site/ is published to GitHub Pages (seamoss.github.io/Textrix), with a
# changelog page built from CHANGELOG.md and the version stamped in.
on:
  push:
    branches: [master]
    paths: [site/**, packaging/site/**, CHANGELOG.md, Cargo.toml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: python3 packaging/site/build.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
