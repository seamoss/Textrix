<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>~*~ WHAT'S NEW IN TEXTRIX ~*~</title>
<meta name="description" content="Every Textrix release, newest first.">
<style>
  :root { --sky: #000033; --ink: #ffff66; --link: #00ffff; --visited: #ff66ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sky); }
  body {
    color: #fff;
    font-family: "Times New Roman", Times, serif;
    font-size: 18px;
    line-height: 1.55;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 140px 90px, #aaf 50%, transparent 51%),
      radial-gradient(2px 2px at 230px 160px, #fff 50%, transparent 51%);
    background-size: 280px 240px;
  }
  a { color: var(--link); }
  a:visited { color: var(--visited); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(2rem, 7vw, 3.4rem);
    text-align: center;
    margin: 0.4em 0 0.1em;
    background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(3px 3px 0 #000);
  }
  .sub { text-align: center; color: var(--ink); font-family: "Comic Sans MS", "Comic Neue", cursive; margin: 0 0 24px; }
  .log {
    background: #fff;
    color: #000;
    border: 4px outset #c0c0c0;
    padding: 4px 22px 18px;
    box-shadow: 8px 8px 0 #000;
  }
  .log h2 {
    font-family: "Comic Sans MS", "Comic Neue", cursive;
    color: #800080;
    border-bottom: 3px ridge #800080;
    margin: 1.2em 0 0.3em;
  }
  .log h2 a { color: inherit; text-decoration: none; }
  .log h2 .date { font-size: 0.65em; color: #666; font-family: "Times New Roman", serif; }
  .log h3 { margin: 0.8em 0 0.2em; color: #000080; font-size: 1.05em; text-transform: uppercase; letter-spacing: 0.08em; }
  .log code { background: #ffffcc; border: 1px solid #ccc; padding: 0 3px; font-size: 0.9em; }
  .log a { color: #0000ee; }
  .log ul { padding-left: 1.3em; }
  .log li { margin: 0.25em 0; }
  .log h2:first-of-type::after {
    content: "NEW!";
    display: inline-block;
    margin-left: 10px;
    font: bold 0.55em Arial, sans-serif;
    color: #fff;
    background: #f00;
    border: 2px solid #ff0;
    padding: 0 5px;
    transform: rotate(-8deg);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { visibility: hidden; } }
  nav { text-align: center; margin: 20px 0; font-family: "Comic Sans MS", "Comic Neue", cursive; }
  footer { text-align: center; color: #aaa; font-size: 0.85rem; padding: 24px 0; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>WHAT'S NEW!!!</h1>
  <p class="sub">Every Textrix release, newest first. Latest: <b>v{{VERSION}}</b></p>
  <nav><a href="./">« back to the homepage</a> · <a href="https://github.com/seamoss/Textrix/releases">downloads</a></nav>
  <div class="log">
{{CHANGELOG}}
  </div>
  <nav><a href="./">« back to the homepage</a></nav>
  <footer>Made from <a href="https://github.com/seamoss/Textrix/blob/master/CHANGELOG.md">CHANGELOG.md</a> every time it changes.</footer>
</main>
</body>
</html>
