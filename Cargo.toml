[package]
name = "textrix"
version = "0.9.5"
edition = "2024"
rust-version = "1.96"
description = "An irssi-style terminal client for Matrix"
license = "MIT"
repository = "https://github.com/seamoss/Textrix"
homepage = "https://github.com/seamoss/Textrix"
readme = "README.md"
keywords = ["matrix", "chat", "tui", "irssi", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
dirs = "7"
eyeball = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false }
imagesize = "0.15"
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite", "markdown"] }
mime = "0.3"
mime_guess = "2"
ratatui = { version = "0.30", features = ["serde"] }
ruma-html = { version = "0.9", features = ["matrix"] }
# Pure Rust: the default `chafa-dyn` feature would link the C libchafa.
ratatui-image = { version = "12.0.0-rc.2", default-features = false, features = ["crossterm", "image-defaults"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
zeroize = "1"
emojis = "0.9.0"
toml_edit = "0.25"
ruma-events = { version = "0.35", features = ["html"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
rhai = { version = "1.26", features = ["serde"] }
regex = "1.13.1"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
opus-decoder = "0.1"
ogg = "0.9"
matrix-sdk-store-encryption = "0.19.1"
rmp-serde = "1.3"
blurhash = "0.2"

# opus-decoder 0.1.1 shifts a u8 past its width in CELT's collapse mask on
# some voice messages; release builds (no overflow checks) play them, so
# debug builds shouldn't panic on them either.
[profile.dev.package.opus-decoder]
overflow-checks = false

[profile.release]
# Whole-program optimisation: about a third smaller (66 → 43 MB), slower to
# build.
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
# macOS ld notes that debug builds' unwind tables pass 16 MB, which only
# slows panic unwinding; it isn't actionable.
linker_messages = "allow"
