[package]
name = "textrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "An irssi-style terminal client for Matrix"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
eyeball = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false }
imagesize = "0.15"
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite", "markdown"] }
mime = "0.3"
mime_guess = "2"
ratatui = "0.30"
ruma-html = { version = "0.9", features = ["matrix"] }
# Pure Rust: the default `chafa-dyn` feature would link the C libchafa.
ratatui-image = { version = "12.0.0-rc.2", default-features = false, features = ["crossterm", "image-defaults"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
zeroize = "1"
emojis = "0.9.0"

[profile.release]
lto = "thin"
strip = true
